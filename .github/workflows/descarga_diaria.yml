name: Descarga Automática de Datos

on:
  workflow_dispatch: # Botón para ejecutarlo a mano
  schedule:
    - cron: '0 22 * * 1-5' # Se ejecuta de Lunes a Viernes a las 22:00 UTC

jobs:
  descargar:
    runs-on: ubuntu-latest
    permissions:
      contents: write # <-- Permiso crucial para que pueda subir los datos

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar librerías
        run: pip install -r requirements.txt

      - name: Ejecutar el script de descarga
        run: python downloader.py

      - name: Guardar los datos en el repositorio
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -f data/
          git commit -m "Actualización automática de datos" || exit 0
          git push